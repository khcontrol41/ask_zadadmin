<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المقرأة - استفسارات وتسميع</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ... (كل الأنماط السابقة كما هي، لم تتغير) ... */
        /* أضف هذه الأنماط الإضافية إن لم تكن موجودة */
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .header-left, .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .refresh-btn { background: #2ecc71; color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .refresh-btn:disabled { background: #95a5a6; }
        .delete-btn { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .delete-btn:disabled { background: #95a5a6; }
        .bulk-btn { background: #8e44ad; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .bulk-btn:disabled { background: #95a5a6; }
        .select-all-label { display: flex; align-items: center; gap: 5px; font-size: 14px; cursor: pointer; }
        .select-all-label input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        .stats-bar { background: #ecf0f1; border-radius: 10px; padding: 10px 15px; margin-bottom: 15px; display: flex; justify-content: space-around; text-align: center; font-size: 14px; flex-wrap: wrap; gap: 5px; }
        /* أنماط البطاقات والمودال ... كما هي */
    </style>
</head>
<body>
<div class="container">
    <!-- شريط التبويبات -->
    <div class="tabs">
        <button class="tab-btn active" id="tabAsk" onclick="switchTab('ask')">📩 الاستفسارات</button>
        <button class="tab-btn" id="tabTashmi" onclick="switchTab('tashmi')">🎙️ التسميع</button>
    </div>

    <!-- ===== تبويب الاستفسارات ===== -->
    <div id="ask-tab">
        <div class="header-actions">
            <div class="header-left">
                <button class="refresh-btn" onclick="loadQuestions()">🔄 تحديث</button>
                <button class="bulk-btn" id="bulkBtn" onclick="openBulkModal()">📨 رد جماعي (0)</button>
                <label class="select-all-label">
                    <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()"> تحديد الكل
                </label>
            </div>
            <div class="header-right">
                <button class="delete-btn" id="deleteBtn" onclick="deleteAnswered()">🗑️ حذف الأسئلة التي تم الرد عليها</button>
            </div>
        </div>
        <div class="stats-bar">
            <div>⏳ في الانتظار: <span class="stats-pending" id="pendingCount">0</span></div>
            <div>🔄 قيد المعالجة: <span class="stats-processing" id="processingCount">0</span></div>
            <div>✅ تم الرد: <span class="stats-answered" id="answeredCount">0</span></div>
            <div>📊 المجموع: <span class="stats-total" id="totalCount">0</span></div>
        </div>
        <div id="questions-container"><div class="loader">⏳ جاري التحميل...</div></div>
    </div>

    <!-- ===== تبويب التسميع ===== -->
    <div id="tashmi-tab" style="display: none;">
        <div class="groups-scroll" id="groupsContainer">
            <!-- تُنشأ بواسطة JS -->
        </div>
        <div class="stats-bar">
            <div>⏳ معلق: <span class="stats-tashmi-pending" id="tashmiPendingCount">0</span></div>
            <div>📊 المجموع: <span class="stats-total" id="tashmiTotalCount">0</span></div>
        </div>
        <div id="tashmi-container"><div class="loader">⏳ جاري تحميل التسميعات...</div></div>
    </div>

    <!-- مودال الرد الجماعي -->
    <div class="modal-overlay" id="bulkModal">
        <div class="modal-box">
            <h2>📨 الرد الجماعي</h2>
            <p>سيتم إرسال الرد إلى <strong id="modalCount">0</strong> طالب.</p>
            <div class="selected-preview" id="selectedPreview"></div>
            <textarea id="bulkReplyText" placeholder="اكتب الرد..."></textarea>
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeBulkModal()">إلغاء</button>
                <button class="send-btn-modal" id="sendBulkBtn" onclick="sendBulkReply()">📤 إرسال</button>
            </div>
        </div>
    </div>
</div>

<script>
    const user = window.Telegram.WebApp.initDataUnsafe.user;
    const adminId = user ? user.id : null;
    const BASE_URL = "https://ask-zadbot.onrender.com"; // غيّر حسب رابطك

    let currentQuestions = [];
    let selectedIds = new Set();
    let currentTashmiRecords = [];
    let currentGroup = 'all';

    // ======================= دوال التبويب =======================
    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        if (tab === 'ask') {
            document.getElementById('tabAsk').classList.add('active');
            document.getElementById('ask-tab').style.display = 'block';
            document.getElementById('tashmi-tab').style.display = 'none';
            loadQuestions();
        } else {
            document.getElementById('tabTashmi').classList.add('active');
            document.getElementById('ask-tab').style.display = 'none';
            document.getElementById('tashmi-tab').style.display = 'block';
            loadTashmiGroups();
        }
    }

    // ======================= دوال الاستفسارات =======================
    function formatUsername(username) {
        if (!username || username === "مجهول") return '👤 مجهول';
        return `👤 <a href="https://t.me/${username}" target="_blank">${username}</a>`;
    }

    async function loadQuestions() {
        const container = document.getElementById('questions-container');
        const refreshBtn = document.querySelector('#ask-tab .refresh-btn');
        refreshBtn.disabled = true;
        if (!adminId) { container.innerHTML = '<div class="error">❌ لم نتمكن من التعرف عليك.</div>'; refreshBtn.disabled=false; return; }
        try {
            const res = await fetch(`${BASE_URL}/get_questions`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: adminId })
            });
            if (!res.ok) throw new Error((await res.json()).error || 'فشل');
            currentQuestions = await res.json();
            const pending = currentQuestions.filter(q => q.status === 'pending').length;
            const processing = currentQuestions.filter(q => q.status === 'processing').length;
            const answered = currentQuestions.filter(q => q.status === 'answered').length;
            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('processingCount').textContent = processing;
            document.getElementById('answeredCount').textContent = answered;
            document.getElementById('totalCount').textContent = currentQuestions.length;
            
            // إظهار/إخفاء زر الحذف
            const deleteBtn = document.getElementById('deleteBtn');
            deleteBtn.style.display = answered > 0 ? 'block' : 'none';
            
            if (currentQuestions.length === 0) { container.innerHTML = '<div class="loader" style="color:#27ae60;">✨ لا توجد استفسارات</div>'; refreshBtn.disabled=false; return; }
            let html = '';
            for (const q of currentQuestions) {
                const isAnswered = q.status === 'answered';
                const isProcessing = q.status === 'processing';
                const isAssignedToMe = isProcessing && q.assigned_to == adminId;
                const isAssignedToOther = isProcessing && !isAssignedToMe;
                const isSelectable = !isAnswered && !isAssignedToOther;
                let badge = '', cardClass = '', contentHtml = '';
                if (isAnswered) { badge = '<span class="answered-badge">✅ تم الرد</span>'; cardClass = 'answered'; contentHtml = `<div class="reply-text"><strong>الرد:</strong> ${q.reply || ''}</div>`; }
                else if (isAssignedToOther) { badge = '<span class="processing-badge">🔄 قيد المعالجة</span>'; cardClass = 'processing'; contentHtml = `<div class="processing-text">⏳ يُعالج من قبل مشرف آخر.</div>`; }
                else {
                    const isMyProcessing = isProcessing && isAssignedToMe;
                    badge = isMyProcessing ? '<span class="processing-badge">🔄 أنت تعالج</span>' : '<span class="pending-badge">⏳ في الانتظار</span>';
                    let actionsHtml = isMyProcessing ? `<button class="unassign-btn" onclick="unassignQuestion(${q.id})">↩️ إلغاء التولي</button>` : `<button class="assign-btn" onclick="assignQuestion(${q.id})">🔄 تولي الرد</button>`;
                    const checkboxHtml = `<input type="checkbox" class="question-checkbox" id="cb-${q.id}" value="${q.id}" ${selectedIds.has(q.id) ? 'checked' : ''} onchange="toggleSelect(${q.id})">`;
                    contentHtml = `<div class="actions">${checkboxHtml}${actionsHtml}</div>
                                   <textarea class="reply-area" placeholder="اكتب ردك..." id="reply-${q.id}" ${isMyProcessing ? '' : 'disabled'}></textarea>
                                   <button class="send-btn" onclick="sendReply(${q.id})" ${isMyProcessing ? '' : 'disabled'}>📤 إرسال الرد</button>`;
                }
                html += `<div class="card ${cardClass}" data-id="${q.id}">${badge}<div class="user">${formatUsername(q.username)}</div><div class="question">"${q.question}"</div>${contentHtml}<div style="font-size:12px;color:#95a5a6;margin-top:5px;">📅 ${q.created_at || ''}</div></div>`;
            }
            container.innerHTML = html;
        } catch(e) { container.innerHTML = `<div class="error">❌ خطأ: ${e.message}</div>`; }
        finally { refreshBtn.disabled = false; }
    }

    // دوال الرد الجماعي والحذف
    function toggleSelect(id) {
        const cb = document.getElementById(`cb-${id}`);
        if (cb.checked) selectedIds.add(id);
        else selectedIds.delete(id);
        document.getElementById('bulkBtn').textContent = `📨 رد جماعي (${selectedIds.size})`;
        // تحديث تحديد الكل
        const allCheckboxes = document.querySelectorAll('.question-checkbox');
        const allChecked = Array.from(allCheckboxes).every(cb => cb.checked);
        document.getElementById('selectAllCheckbox').checked = allChecked;
    }

    function toggleSelectAll() {
        const isChecked = document.getElementById('selectAllCheckbox').checked;
        const checkboxes = document.querySelectorAll('.question-checkbox');
        checkboxes.forEach(cb => {
            cb.checked = isChecked;
            const id = parseInt(cb.value);
            if (isChecked) selectedIds.add(id);
            else selectedIds.delete(id);
        });
        document.getElementById('bulkBtn').textContent = `📨 رد جماعي (${selectedIds.size})`;
    }

    function openBulkModal() {
        if (selectedIds.size === 0) { alert('الرجاء اختيار سؤال واحد على الأقل.'); return; }
        document.getElementById('modalCount').textContent = selectedIds.size;
        const previewDiv = document.getElementById('selectedPreview');
        let previewHtml = '';
        let count = 0;
        for (const q of currentQuestions) {
            if (selectedIds.has(q.id)) {
                count++;
                const previewText = q.question.length > 50 ? q.question.substring(0, 50) + '...' : q.question;
                previewHtml += `<div class="preview-item"><strong>${count}.</strong> ${q.username || 'مجهول'}: "${previewText}"</div>`;
            }
        }
        previewDiv.innerHTML = previewHtml || '<div style="color:#95a5a6;">لا توجد معاينة</div>';
        document.getElementById('bulkReplyText').value = '';
        document.getElementById('sendBulkBtn').disabled = false;
        document.getElementById('sendBulkBtn').textContent = '📤 إرسال للجميع';
        document.getElementById('bulkModal').classList.add('active');
    }

    function closeBulkModal() {
        document.getElementById('bulkModal').classList.remove('active');
    }

    async function sendBulkReply() {
        const replyText = document.getElementById('bulkReplyText').value.trim();
        if (!replyText) { alert('الرجاء كتابة الرد.'); return; }
        const sendBtn = document.getElementById('sendBulkBtn');
        sendBtn.disabled = true; sendBtn.textContent = '⏳ جاري...';
        try {
            const res = await fetch(`${BASE_URL}/bulk_reply`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    question_ids: Array.from(selectedIds),
                    reply_text: replyText,
                    admin_id: adminId
                })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'فشل');
            alert(`✅ تم الإرسال لـ ${data.sent} طالب.`);
            closeBulkModal();
            loadQuestions();
        } catch(e) { alert(`❌ ${e.message}`); sendBtn.disabled = false; sendBtn.textContent = '📤 إرسال للجميع'; }
    }

    async function deleteAnswered() {
        if (!confirm('⚠️ هل أنت متأكد من حذف جميع الاستفسارات التي تم الرد عليها؟')) return;
        const deleteBtn = document.getElementById('deleteBtn');
        deleteBtn.disabled = true; deleteBtn.textContent = '⏳ جاري...';
        try {
            const res = await fetch(`${BASE_URL}/delete_answered`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin_id: adminId })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'فشل');
            alert(`✅ تم حذف ${data.deleted || 0} استفسار.`);
            loadQuestions();
        } catch(e) { alert(`❌ ${e.message}`); }
        finally { deleteBtn.disabled = false; deleteBtn.textContent = '🗑️ حذف الأسئلة التي تم الرد عليها'; }
    }

    async function assignQuestion(qId) { /* ... كما هي ... */ }
    async function unassignQuestion(qId) { /* ... كما هي ... */ }
    async function sendReply(qId) { /* ... كما هي ... */ }

    // ======================= دوال التسميع =======================
    async function loadTashmiGroups() {
        // ... (نفس الكود السابق) ...
    }
    function switchGroup(groupId) { /* ... */ }
    function renderTashmiRecords(records) { /* ... */ }
    function setSpeed(audioId, rate) { /* ... */ }
    async function assignTashmi(recordId) { /* ... */ }
    async function sendTashmiReply(recordId) { /* ... */ }

    // بدء التشغيل
    document.addEventListener('DOMContentLoaded', () => {
        if (!adminId) { document.body.innerHTML = '<div class="error" style="padding:40px;">❌ لم نتمكن من التعرف عليك.</div>'; return; }
        switchTab('ask');
    });
</script>
</body>
</html>
