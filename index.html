<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة استفسارات المقرأة</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 15px; background: #f4f7fa; }
        .container { max-width: 700px; margin: auto; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-right: 5px solid #f39c12; }
        .card.answered { border-right-color: #27ae60; }
        .card.processing { border-right-color: #3498db; opacity: 0.9; }
        h1 { color: #2c3e50; font-size: 22px; margin: 0; }
        .user { font-weight: bold; color: #2980b9; }
        .question { margin: 10px 0; background: #ecf0f1; padding: 10px; border-radius: 8px; }
        .reply-area { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin: 5px 0; font-family: inherit; }
        .reply-area:disabled { background: #ecf0f1; color: #7f8c8d; cursor: not-allowed; }
        .send-btn { background: #0088cc; color: white; border: none; padding: 10px 20px; border-radius: 8px; width: 100%; font-size: 16px; cursor: pointer; margin-top: 5px; }
        .send-btn:disabled { background: #95a5a6; cursor: not-allowed; }
        .assign-btn { background: #f39c12; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .assign-btn:disabled { background: #95a5a6; cursor: not-allowed; }
        .unassign-btn { background: #e67e22; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .unassign-btn:disabled { background: #95a5a6; cursor: not-allowed; }
        .pending-badge { background: #f39c12; color: white; padding: 2px 10px; border-radius: 20px; font-size: 12px; }
        .answered-badge { background: #27ae60; color: white; padding: 2px 10px; border-radius: 20px; font-size: 12px; }
        .processing-badge { background: #3498db; color: white; padding: 2px 10px; border-radius: 20px; font-size: 12px; }
        .reply-text { background: #d5f5e3; padding: 10px; border-radius: 8px; color: #1e8449; margin-top: 10px; }
        .processing-text { background: #d6eaf8; padding: 10px; border-radius: 8px; color: #1a5276; margin-top: 10px; text-align: center; }
        .loader { text-align: center; color: #7f8c8d; padding: 20px; }
        .error { color: red; text-align: center; }
        
        /* Header and Buttons */
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .header-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .refresh-btn { background: #2ecc71; color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .refresh-btn:disabled { background: #95a5a6; cursor: not-allowed; }
        .delete-btn { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .delete-btn:disabled { background: #95a5a6; cursor: not-allowed; }
        .bulk-btn { background: #8e44ad; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .bulk-btn:disabled { background: #95a5a6; cursor: not-allowed; }
        .select-all-label { display: flex; align-items: center; gap: 5px; font-size: 14px; cursor: pointer; }
        .select-all-label input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        
        .stats-bar { background: #ecf0f1; border-radius: 10px; padding: 10px 15px; margin-bottom: 15px; display: flex; justify-content: space-around; text-align: center; font-size: 14px; flex-wrap: wrap; gap: 5px; }
        .stats-bar span { font-weight: bold; }
        .stats-pending { color: #f39c12; }
        .stats-processing { color: #3498db; }
        .stats-answered { color: #27ae60; }
        .stats-total { color: #2980b9; }

        .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 5px 0; }
        .question-checkbox { width: 20px; height: 20px; margin-left: 10px; cursor: pointer; }

        /* Modal (النافذة المنبثقة) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: white; border-radius: 16px; padding: 25px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; direction: rtl; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .modal-box h2 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #8e44ad; padding-bottom: 10px; }
        .modal-box .selected-preview { background: #f8f9fa; border-radius: 8px; padding: 10px; margin: 10px 0; max-height: 150px; overflow-y: auto; font-size: 14px; }
        .modal-box .selected-preview .preview-item { padding: 5px 0; border-bottom: 1px solid #eee; }
        .modal-box .selected-preview .preview-item:last-child { border-bottom: none; }
        .modal-box textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; min-height: 120px; font-family: inherit; font-size: 16px; margin: 10px 0; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
        .modal-actions button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .modal-actions .cancel-btn { background: #95a5a6; color: white; }
        .modal-actions .send-btn-modal { background: #8e44ad; color: white; }
        .modal-actions .send-btn-modal:disabled { background: #95a5a6; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-actions">
            <div class="header-left">
                <h1>📋 لوحة الاستفسارات</h1>
                <button class="refresh-btn" id="refreshBtn" onclick="loadQuestions()">🔄 تحديث</button>
                <!-- ✅ زر الرد الجماعي مع عداد -->
                <button class="bulk-btn" id="bulkBtn" onclick="openBulkModal()">📨 رد جماعي (0)</button>
                <!-- ✅ تحديد الكل -->
                <label class="select-all-label" id="selectAllLabel">
                    <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()"> تحديد الكل
                </label>
            </div>
            <div class="header-right">
                <button class="delete-btn" id="deleteBtn" onclick="deleteAnswered()">🗑️ حذف التي تم الرد عليها</button>
            </div>
        </div>

        <div class="stats-bar" id="statsBar">
            <div>⏳ في الانتظار: <span class="stats-pending" id="pendingCount">0</span></div>
            <div>🔄 قيد المعالجة: <span class="stats-processing" id="processingCount">0</span></div>
            <div>✅ تم الرد: <span class="stats-answered" id="answeredCount">0</span></div>
            <div>📊 المجموع: <span class="stats-total" id="totalCount">0</span></div>
        </div>

        <div id="questions-container">
            <div class="loader">⏳ جاري تحميل الاستفسارات...</div>
        </div>
    </div>

    <!-- ✅ النافذة المنبثقة (Modal) للرد الجماعي -->
    <div class="modal-overlay" id="bulkModal">
        <div class="modal-box">
            <h2>📨 الرد الجماعي</h2>
            <p>سيتم إرسال الرد إلى <strong id="modalCount">0</strong> طالب.</p>
            <div class="selected-preview" id="selectedPreview">
                <!-- سيتم ملؤها بواسطة JavaScript -->
            </div>
            <textarea id="bulkReplyText" placeholder="اكتب الرد الذي تريد إرساله للجميع..."></textarea>
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeBulkModal()">إلغاء</button>
                <button class="send-btn-modal" id="sendBulkBtn" onclick="sendBulkReply()">📤 إرسال للجميع</button>
            </div>
        </div>
    </div>

    <script>
        const user = window.Telegram.WebApp.initDataUnsafe.user;
        const adminId = user ? user.id : null;
        const BASE_URL = "https://ask-zadbot.onrender.com"; // ⚠️ استبدل هذا بالرابط الصحيح
        
        let currentQuestions = [];
        let selectedIds = new Set();

        async function loadQuestions() {
            const container = document.getElementById('questions-container');
            const deleteBtn = document.getElementById('deleteBtn');
            const refreshBtn = document.getElementById('refreshBtn');
            
            refreshBtn.disabled = true;
            refreshBtn.textContent = '⏳ جاري...';

            if (!adminId) {
                container.innerHTML = '<div class="error">❌ لم نتمكن من التعرف على حسابك.</div>';
                refreshBtn.disabled = false;
                refreshBtn.textContent = '🔄 تحديث';
                return;
            }

            try {
                const response = await fetch(`${BASE_URL}/get_questions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: adminId })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || 'فشل التحميل');
                }

                currentQuestions = await response.json();
                
                // تحديث العداد
                const pending = currentQuestions.filter(q => q.status === 'pending').length;
                const processing = currentQuestions.filter(q => q.status === 'processing').length;
                const answered = currentQuestions.filter(q => q.status === 'answered').length;
                document.getElementById('pendingCount').textContent = pending;
                document.getElementById('processingCount').textContent = processing;
                document.getElementById('answeredCount').textContent = answered;
                document.getElementById('totalCount').textContent = currentQuestions.length;

                const hasAnswered = answered > 0;
                deleteBtn.style.display = hasAnswered ? 'block' : 'none';
                
                // ✅ إعادة تعيين التحديدات
                selectedIds.clear();
                document.getElementById('selectAllCheckbox').checked = false;
                updateBulkCounter();

                if (currentQuestions.length === 0) {
                    container.innerHTML = '<div class="loader" style="color: #27ae60;">✨ لا توجد استفسارات حالياً</div>';
                    refreshBtn.disabled = false;
                    refreshBtn.textContent = '🔄 تحديث';
                    return;
                }

                let html = '';
                for (const q of currentQuestions) {
                    const isAnswered = q.status === 'answered';
                    const isProcessing = q.status === 'processing';
                    const isAssignedToMe = isProcessing && q.assigned_to == adminId;
                    const isAssignedToOther = isProcessing && !isAssignedToMe;
                    const isSelectable = !isAnswered && !isAssignedToOther; // يمكن تحديد المعلق أو المسند لي
                    
                    let badge = '';
                    let cardClass = '';
                    let contentHtml = '';

                    if (isAnswered) {
                        badge = '<span class="answered-badge">✅ تم الرد</span>';
                        cardClass = 'answered';
                        contentHtml = `
                            <div class="reply-text"><strong>الرد:</strong> ${q.reply || ''}</div>
                        `;
                    } else if (isAssignedToOther) {
                        badge = '<span class="processing-badge">🔄 قيد المعالجة</span>';
                        cardClass = 'processing';
                        contentHtml = `
                            <div class="processing-text">⏳ هذا الاستفسار قيد المعالجة من قبل أحد المشرفين.</div>
                        `;
                    } else { // pending أو processing للمشرف نفسه
                        const isMyProcessing = isProcessing && isAssignedToMe;
                        badge = isMyProcessing ? '<span class="processing-badge">🔄 أنت تعالج هذا السؤال</span>' : '<span class="pending-badge">⏳ في الانتظار</span>';
                        cardClass = isMyProcessing ? 'processing' : '';
                        
                        let actionsHtml = '';
                        if (isMyProcessing) {
                            actionsHtml = `
                                <button class="unassign-btn" onclick="unassignQuestion(${q.id})">↩️ إلغاء التولي</button>
                            `;
                        } else {
                            actionsHtml = `
                                <button class="assign-btn" onclick="assignQuestion(${q.id})">🔄 تولي الرد</button>
                            `;
                        }

                        // ✅ إضافة مربع الاختيار
                        const checkboxHtml = `
                            <input type="checkbox" class="question-checkbox" id="cb-${q.id}" value="${q.id}" ${selectedIds.has(q.id) ? 'checked' : ''} onchange="toggleSelect(${q.id})">
                        `;

                        contentHtml = `
                            <div class="actions">
                                ${checkboxHtml}
                                ${actionsHtml}
                            </div>
                            <textarea class="reply-area" placeholder="اكتب ردك هنا..." id="reply-${q.id}" ${isMyProcessing ? '' : 'disabled'}>${q._tempText || ''}</textarea>
                            <button class="send-btn" onclick="sendReply(${q.id})" ${isMyProcessing ? '' : 'disabled'}>📤 إرسال الرد</button>
                        `;
                    }

                    html += `
                        <div class="card ${cardClass}" data-id="${q.id}">
                            ${badge}
                            <div class="user">👤 ${q.username || 'مجهول'}</div>
                            <div class="question">"${q.question}"</div>
                            ${contentHtml}
                            <div style="font-size:12px; color:#95a5a6; margin-top:5px;">📅 ${q.created_at || ''}</div>
                        </div>
                    `;
                }
                container.innerHTML = html;

            } catch (error) {
                container.innerHTML = `<div class="error">❌ خطأ: ${error.message}</div>`;
                console.error(error);
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.textContent = '🔄 تحديث';
            }
        }

        // --- دوال التحديد والعداد ---
        function toggleSelect(questionId) {
            const cb = document.getElementById(`cb-${questionId}`);
            if (cb.checked) {
                selectedIds.add(questionId);
            } else {
                selectedIds.delete(questionId);
            }
            updateBulkCounter();
            // تحديث حالة "تحديد الكل"
            const allCheckboxes = document.querySelectorAll('.question-checkbox');
            const allChecked = Array.from(allCheckboxes).every(cb => cb.checked);
            document.getElementById('selectAllCheckbox').checked = allChecked;
        }

        function toggleSelectAll() {
            const isChecked = document.getElementById('selectAllCheckbox').checked;
            const checkboxes = document.querySelectorAll('.question-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = isChecked;
                const id = parseInt(cb.value);
                if (isChecked) selectedIds.add(id);
                else selectedIds.delete(id);
            });
            updateBulkCounter();
        }

        function updateBulkCounter() {
            const count = selectedIds.size;
            document.getElementById('bulkBtn').textContent = `📨 رد جماعي (${count})`;
            // إظهار أو إخفاء زر "تحديد الكل" حسب وجود أسئلة قابلة للتحديد
            const hasSelectable = document.querySelectorAll('.question-checkbox').length > 0;
            document.getElementById('selectAllLabel').style.display = hasSelectable ? 'flex' : 'none';
        }

        // --- النافذة المنبثقة ---
        function openBulkModal() {
            if (selectedIds.size === 0) {
                alert('الرجاء اختيار سؤال واحد على الأقل للرد الجماعي.');
                return;
            }
            // تحديث العداد في النافذة
            document.getElementById('modalCount').textContent = selectedIds.size;
            
            // عرض معاينة الأسئلة المختارة
            const previewDiv = document.getElementById('selectedPreview');
            let previewHtml = '';
            let count = 0;
            for (const q of currentQuestions) {
                if (selectedIds.has(q.id)) {
                    count++;
                    const previewText = q.question.length > 50 ? q.question.substring(0, 50) + '...' : q.question;
                    previewHtml += `<div class="preview-item"><strong>${count}.</strong> ${q.username || 'مجهول'}: "${previewText}"</div>`;
                }
            }
            previewDiv.innerHTML = previewHtml || '<div style="color:#95a5a6;">لا توجد معاينة</div>';
            
            // إفراغ حقل النص
            document.getElementById('bulkReplyText').value = '';
            document.getElementById('sendBulkBtn').disabled = false;
            document.getElementById('sendBulkBtn').textContent = '📤 إرسال للجميع';
            
            document.getElementById('bulkModal').classList.add('active');
        }

        function closeBulkModal() {
            document.getElementById('bulkModal').classList.remove('active');
        }

        // --- إرسال الرد الجماعي ---
        async function sendBulkReply() {
            const replyText = document.getElementById('bulkReplyText').value.trim();
            if (!replyText) {
                alert('الرجاء كتابة الرد قبل الإرسال.');
                return;
            }

            const sendBtn = document.getElementById('sendBulkBtn');
            sendBtn.disabled = true;
            sendBtn.textContent = '⏳ جاري الإرسال...';

            const idsArray = Array.from(selectedIds);

            try {
                const response = await fetch(`${BASE_URL}/bulk_reply`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question_ids: idsArray,
                        reply_text: replyText,
                        admin_id: adminId
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'فشل الإرسال الجماعي');
                }

                let message = `✅ تم إرسال الرد لـ ${result.sent} طالب بنجاح.`;
                if (result.failed > 0) {
                    message += `\n⚠️ فشل الإرسال لـ ${result.failed} طالب. (قد تكون الأسئلة غير متاحة حالياً)`;
                }
                alert(message);
                
                closeBulkModal();
                loadQuestions(); // تحديث القائمة

            } catch (error) {
                alert(`❌ فشل الإرسال الجماعي: ${error.message}`);
                sendBtn.disabled = false;
                sendBtn.textContent = '📤 إرسال للجميع';
            }
        }

        // --- باقي الدوال (تولي، إلغاء، رد فردي، حذف) ---
        async function assignQuestion(questionId) {
            try {
                const response = await fetch(`${BASE_URL}/assign`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question_id: questionId,
                        admin_id: adminId
                    })
                });
                const result = await response.json();

                if (!response.ok) {
                    alert(`❌ فشل تولي الرد: ${result.error || 'خطأ غير معروف'}`);
                    return;
                }
                loadQuestions();

            } catch (error) {
                alert(`❌ فشل تولي الرد: ${error.message}`);
                console.error(error);
            }
        }

        async function unassignQuestion(questionId) {
            try {
                const response = await fetch(`${BASE_URL}/unassign`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question_id: questionId,
                        admin_id: adminId
                    })
                });
                const result = await response.json();

                if (!response.ok) {
                    alert(`❌ فشل إلغاء التولي: ${result.error || 'خطأ غير معروف'}`);
                    return;
                }
                loadQuestions();

            } catch (error) {
                alert(`❌ فشل إلغاء التولي: ${error.message}`);
                console.error(error);
            }
        }

        async function sendReply(questionId) {
            const textarea = document.getElementById(`reply-${questionId}`);
            const replyText = textarea.value.trim();
            const button = textarea.nextElementSibling;

            if (!replyText) {
                alert('الرجاء كتابة الرد أولاً');
                return;
            }

            button.disabled = true;
            button.textContent = '⏳ جاري الإرسال...';

            try {
                const response = await fetch(`${BASE_URL}/reply`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question_id: questionId,
                        reply_text: replyText,
                        admin_id: adminId
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'فشل الإرسال');
                }

                loadQuestions();

            } catch (error) {
                alert(`❌ فشل الإرسال: ${error.message}`);
                button.disabled = false;
                button.textContent = '📤 إرسال الرد';
            }
        }

        async function deleteAnswered() {
            if (!confirm('⚠️ هل أنت متأكد من حذف جميع الاستفسارات التي تم الرد عليها؟')) {
                return;
            }

            const deleteBtn = document.getElementById('deleteBtn');
            deleteBtn.disabled = true;
            deleteBtn.textContent = '⏳ جاري الحذف...';

            try {
                const response = await fetch(`${BASE_URL}/delete_answered`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admin_id: adminId })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'فشل الحذف');
                }

                alert(`✅ تم حذف ${result.deleted} استفسار بنجاح!`);
                loadQuestions();

            } catch (error) {
                alert(`❌ فشل الحذف: ${error.message}`);
                deleteBtn.disabled = false;
                deleteBtn.textContent = '🗑️ حذف التي تم الرد عليها';
            }
        }

        document.addEventListener('DOMContentLoaded', loadQuestions);
    </script>
</body>
</html>
